services:
  # 1. Banco de Dados MySQL
  db:
    image: mysql:8
    restart: always
    container_name: cyberthreats-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: incident_db
    ports:
      - "3306:3306"

  # 2. Microsserviço de Inteligência Artificial (Python)
  backend-ia:
    build: ./backend-ia
    container_name: cyberthreats-ia
    ports:
      - "8000:8000"
    volumes:
      - ./backend-ia:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  # 3. Backend Principal (Node.js)
  backend-node:
    build: ./backend-node
    container_name: cyberthreats-node
    ports:
      - "3333:3333"
      - "5555:5555"
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    environment:
      DATABASE_URL: "mysql://root:root@db:3306/incident_db"
      AI_API_URL: "http://backend-ia:8000"
      FRONTEND_URL: "http://localhost:3001"
      JWT_SECRET: "your_jwt_secret_key_very_very_long_for_more_security_with_number_and_symbols_1234567890!@#$%^&*()"
    depends_on:
      - db
      - backend-ia
  # 4. Frontend (Next.js)
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile 
    container_name: cyberthreats-web
    ports:
      - "3001:3000" # Mapeia a porta 3001 do host para a 3000 do container
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3333/v1"
    depends_on:
      - backend-node