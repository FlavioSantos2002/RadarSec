services:
  # 1. Banco de Dados MySQL
  db:
    image: mysql:8
    restart: always
    container_name: radarsec-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: radarsec_db
    ports:
      - "3306:3306"
    volumes:
      - radarsec_db_data:/var/lib/mysql

  # 2. Backend Node.js
  backend-node:
    build: ./backend-node
    container_name: radarsec-node
    ports:
      - "3333:3333"
      - "5555:5555"
    volumes:
      - ./backend-node:/app
      - /app/node_modules
      - radarsec_uploads:/app/uploads
    environment:
      DATABASE_URL: "mysql://root:root@db:3306/radarsec_db"
      FRONTEND_URL: "http://localhost:3001"
      UPLOAD_DIR: "/app/uploads"
      JWT_SECRET: "radarsec_jwt_secret_key_very_long_and_secure_1234567890!@#$%^&*()"
    depends_on:
      - db

  # 3. Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radarsec-web
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3333/v1"
    depends_on:
      - backend-node

volumes:
  radarsec_db_data:
  radarsec_uploads: