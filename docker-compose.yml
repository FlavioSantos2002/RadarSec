services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radarsec
      POSTGRES_PASSWORD: radarsec_pass
      POSTGRES_DB: radarsec_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radarsec -d radarsec_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://radarsec:radarsec_pass@db:5432/radarsec_db
      JWT_SECRET: supersecret_change_in_production
      JWT_EXPIRES_IN: 8h
      PORT: 3001
      BCRYPT_ROUNDS: "12"
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: development
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"

volumes:
  pgdata:
  uploads:
