services:
  # 1. Banco de Dados MySQL
  db:
    image: mysql:8
    restart: always
    container_name: plottwister-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: plottwister_db
    ports:
      - "3306:3306"

  # 2. Backend Principal (Node.js)
  backend-node:
    build: ./backend-node
    container_name: plottwister-node
    ports:
      - "3333:3333"
      - "5555:5555"
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    environment:
      DATABASE_URL: "mysql://root:root@db:3306/plottwister_db"
      FRONTEND_URL: "http://localhost:3001"
      JWT_SECRET: "your_jwt_secret_key_very_very_long_for_more_security_with_number_and_symbols_1234567890!@#$%^&*()"
    depends_on:
      - db

  # 3. Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plottwister-web
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3333/v1"
    depends_on:
      - backend-node